name: Build LaTeX Books

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full python3

      - name: Convert HTML to LaTeX
        run: |
          python3 convert_to_latex.py

      - name: Compile PDFs
        run: |
          cd latex_output
          for i in book1.tex book2.tex book3.tex book4.tex book5.tex book6.tex; do
            pdflatex "$i"
            pdflatex "$i"
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crime-and-punishment-books
          path: latex_output/*.pdf
          retention-days: 30