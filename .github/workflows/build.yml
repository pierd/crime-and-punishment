name: Build LaTeX Books

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended python3

      - name: Convert HTML to LaTeX
        run: |
          python3 convert_to_latex.py

      - name: Compile PDFs
        run: |
          cd latex_output
          for i in book1.tex book2.tex book3.tex book4.tex book5.tex book6.tex; do
            pdflatex "$i"
            pdflatex "$i"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Crime and Punishment - Build ${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}
            
            Generated 6 books in A5 format:
            - Book 1: Translator's Preface + Part I
            - Book 2: Part II
            - Book 3: Part III
            - Book 4: Part IV
            - Book 5: Part V
            - Book 6: Part VI + Epilogue
          files: latex_output/*.pdf
          draft: false
          prerelease: false